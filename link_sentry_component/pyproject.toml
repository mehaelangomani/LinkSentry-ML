[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "link-sentry-component"
version = "1.0.0"
description = "LinkSentry custom Streamlit component for phishing URL detection"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.30.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["link_sentry_component*"]

[tool.setuptools.package-data]
"link_sentry_component" = ["dist/**/*", "st-component.json"]